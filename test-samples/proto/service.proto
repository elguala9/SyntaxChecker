syntax = "proto3";

package example.v1;

option go_package = "github.com/example/api/v1;apiv1";

// User is a registered account.
message User {
  string id = 1;
  string email = 2;
  repeated string roles = 3;
  Status status = 4;
}

enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_ACTIVE = 1;
  STATUS_DISABLED = 2;
}

message GetUserRequest {
  string id = 1;
}

service UserService {
  rpc GetUser(GetUserRequest) returns (User);
}
