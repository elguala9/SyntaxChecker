services:
  web:
    image: nginx:1.27
    ports:
      - "8080:80"
    environment:
      - NGINX_HOST=localhost
    depends_on:
      - db
    restart: unless-stopped
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: example
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:

networks:
  default:
    driver: bridge
